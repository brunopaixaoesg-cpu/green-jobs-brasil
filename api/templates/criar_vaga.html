<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Vaga | Green Jobs Brasil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2ECC71;
            --dark-green: #27AE60;
            --light-green: #A9DFBF;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 3rem;
            margin: 2rem auto;
            max-width: 800px;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .form-header h1 {
            color: var(--dark-green);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .form-header p {
            color: #6C757D;
            font-size: 1.1rem;
        }
        
        .form-section {
            margin-bottom: 2rem;
        }
        
        .form-section h3 {
            color: var(--dark-green);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--light-green);
            padding-bottom: 0.5rem;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            border: 2px solid #E9ECEF;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(46, 204, 113, 0.25);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        
        .btn-secondary {
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
        }
        
        .checkbox-group {
            background: #F8F9FA;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 0.5rem;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }
        
        .salary-inputs {
            display: flex;
            gap: 1rem;
        }
        
        .salary-inputs .form-control {
            flex: 1;
        }
        
        @media (max-width: 768px) {
            .form-container {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            
            .salary-inputs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h1><i class="fas fa-briefcase text-success"></i> Criar Nova Vaga</h1>
                <p>Publique uma oportunidade de emprego ESG e encontre os melhores candidatos sustentáveis</p>
            </div>

            <form id="criarVagaForm">
                <!-- Informações Básicas -->
                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> Informações Básicas</h3>
                    
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="titulo" class="form-label">Título da Vaga *</label>
                            <input type="text" class="form-control" id="titulo" placeholder="Ex: Analista de Sustentabilidade Jr." required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nivel_experiencia" class="form-label">Nível de Experiência *</label>
                            <select class="form-select" id="nivel_experiencia" required>
                                <option value="">Selecione...</option>
                                <option value="estagio">Estágio</option>
                                <option value="junior">Júnior (0-2 anos)</option>
                                <option value="pleno">Pleno (3-5 anos)</option>
                                <option value="senior">Sênior (6+ anos)</option>
                                <option value="especialista">Especialista</option>
                                <option value="lideranca">Liderança</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="tipo_contratacao" class="form-label">Tipo de Contratação *</label>
                            <select class="form-select" id="tipo_contratacao" required>
                                <option value="">Selecione...</option>
                                <option value="clt">CLT</option>
                                <option value="pj">Pessoa Jurídica</option>
                                <option value="estagio">Estágio</option>
                                <option value="temporario">Temporário</option>
                                <option value="freelancer">Freelancer</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Localização -->
                <div class="form-section">
                    <h3><i class="fas fa-map-marker-alt"></i> Localização</h3>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="localizacao_cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="localizacao_cidade" placeholder="Ex: São Paulo">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="localizacao_uf" class="form-label">Estado (UF)</label>
                            <select class="form-select" id="localizacao_uf">
                                <option value="">Selecione...</option>
                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="checkbox-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remoto">
                            <label class="form-check-label" for="remoto">
                                <i class="fas fa-home"></i> <strong>Trabalho remoto disponível</strong>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Remuneração -->
                <div class="form-section">
                    <h3><i class="fas fa-dollar-sign"></i> Remuneração</h3>
                    
                    <div class="salary-inputs">
                        <div>
                            <label for="salario_min" class="form-label">Salário Mínimo (R$)</label>
                            <input type="number" class="form-control" id="salario_min" placeholder="3000" min="0" step="100">
                        </div>
                        <div>
                            <label for="salario_max" class="form-label">Salário Máximo (R$)</label>
                            <input type="number" class="form-control" id="salario_max" placeholder="8000" min="0" step="100">
                        </div>
                    </div>
                </div>

                <!-- Descrição -->
                <div class="form-section">
                    <h3><i class="fas fa-align-left"></i> Descrição da Vaga</h3>
                    
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição Completa *</label>
                        <textarea class="form-control" id="descricao" rows="8" placeholder="Descreva as responsabilidades, requisitos, benefícios e diferenciais da vaga...

Exemplo:
• Responsabilidades: Desenvolver e implementar estratégias de sustentabilidade
• Requisitos: Formação em áreas relacionadas, conhecimento em ESG
• Benefícios: Vale alimentação, plano de saúde, home office flexível
• Diferenciais: Empresa certificada B Corp, projetos de impacto social" required></textarea>
                    </div>
                </div>

                <!-- CNPJ da Empresa (campo oculto por enquanto) -->
                <input type="hidden" id="cnpj_empresa" value="60.331.021/0001-11">

                <!-- Botões -->
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-secondary me-3" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                    <button type="submit" class="btn btn-success" id="btnCriarVaga">
                        <i class="fas fa-briefcase"></i> Criar Vaga
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Formulário de criação de vaga carregado');
            
            const form = document.getElementById('criarVagaForm');
            const btnCriar = document.getElementById('btnCriarVaga');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('📝 Formulário submetido');
                
                // Prevenir múltiplos clicks
                if (btnCriar.disabled) {
                    console.log('⚠️ Botão já desabilitado, ignorando submit');
                    return;
                }
                
                // Coletar dados do formulário
                const dadosVaga = {
                    titulo: document.getElementById('titulo').value.trim(),
                    descricao: document.getElementById('descricao').value.trim(),
                    cnpj_empresa: document.getElementById('cnpj_empresa').value,
                    nivel_experiencia: document.getElementById('nivel_experiencia').value,
                    tipo_contratacao: document.getElementById('tipo_contratacao').value,
                    localizacao_cidade: document.getElementById('localizacao_cidade').value.trim(),
                    localizacao_uf: document.getElementById('localizacao_uf').value,
                    remoto: document.getElementById('remoto').checked,
                    salario_min: parseFloat(document.getElementById('salario_min').value) || null,
                    salario_max: parseFloat(document.getElementById('salario_max').value) || null
                };
                
                console.log('📋 Dados da vaga:', dadosVaga);
                
                // Validações básicas
                if (!dadosVaga.titulo || !dadosVaga.descricao || !dadosVaga.nivel_experiencia || !dadosVaga.tipo_contratacao) {
                    alert('❌ Por favor, preencha todos os campos obrigatórios (*)');
                    return;
                }
                
                // Mostrar loading
                const originalText = btnCriar.innerHTML;
                btnCriar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando Vaga...';
                btnCriar.disabled = true;
                
                console.log('🚀 Enviando requisição para /api/vagas/criar...');
                
                // Submeter para API
                fetch('/api/vagas/criar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dadosVaga)
                })
                .then(response => {
                    console.log('📡 Status da resposta:', response.status, response.statusText);
                    return response.json();
                })
                .then(data => {
                    console.log('✅ Resposta da API:', data);
                    
                    if (data.message && data.vaga_id) {
                        // Mostrar modal de sucesso
                        alert(`🎉 ${data.message}

Título: ${data.titulo}
Empresa: ${data.empresa}
ID da Vaga: ${data.vaga_id}

A vaga foi publicada com sucesso!`);
                        
                        // Redirecionar para dashboard
                        window.location.href = '/empresas/dashboard';
                    } else {
                        console.error('❌ Erro retornado pela API:', data);
                        alert('❌ Erro ao criar vaga: ' + (data.detail || data.error || 'Erro desconhecido'));
                        btnCriar.innerHTML = originalText;
                        btnCriar.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('💥 Erro na requisição:', error);
                    alert(`❌ Erro de conexão: ${error.message}

Verifique se:
- A API está rodando
- Sua conexão com a internet está funcionando
- Tente novamente em alguns segundos`);
                    btnCriar.innerHTML = originalText;
                    btnCriar.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
