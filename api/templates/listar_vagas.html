<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagas ESG | Green Jobs Brasil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2ECC71;
            --dark-green: #27AE60;
            --light-green: #A9DFBF;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        .header-section {
            background: linear-gradient(135deg, var(--dark-green), var(--primary-green));
            color: white;
            padding: 3rem 0;
            margin-bottom: 3rem;
            border-radius: 0 0 30px 30px;
        }
        
        .vaga-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            transition: all 0.3s;
            overflow: hidden;
        }
        
        .vaga-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.2);
        }
        
        .vaga-header {
            background: linear-gradient(135deg, #F8F9FA, #E9ECEF);
            padding: 1.5rem;
            border-bottom: 3px solid var(--light-green);
        }
        
        .vaga-body {
            padding: 1.5rem;
        }
        
        .empresa-badge {
            background: var(--primary-green);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .days-badge {
            background: #E3F2FD;
            color: #1976D2;
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            font-size: 0.75rem;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .info-item i {
            width: 20px;
            color: var(--primary-green);
            margin-right: 0.5rem;
        }
        
        .btn-candidatar {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-candidatar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            color: white;
        }
        
        .filters-section {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
        }
        
        .no-vagas {
            text-align: center;
            padding: 3rem;
            color: #6C757D;
        }
        
        @media (max-width: 768px) {
            .header-section {
                padding: 2rem 0;
                margin-bottom: 2rem;
            }
            
            .vaga-card {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-briefcase"></i> Vagas ESG Disponíveis</h1>
                    <p class="lead mb-0">Encontre oportunidades sustentáveis que fazem a diferença</p>
                </div>
                <div class="col-md-4 text-end">
                    <div class="stats">
                        <h3 id="totalVagas">0</h3>
                        <small>Vagas Ativas</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Filtros -->
        <div class="filters-section">
            <div class="row align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Localização</label>
                    <select class="form-select" id="filtroLocal">
                        <option value="">Todas as cidades</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="remoto">Remoto</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nível</label>
                    <select class="form-select" id="filtroNivel">
                        <option value="">Todos os níveis</option>
                        <option value="estagio">Estágio</option>
                        <option value="junior">Júnior</option>
                        <option value="pleno">Pleno</option>
                        <option value="senior">Sênior</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Contratação</label>
                    <select class="form-select" id="filtroContratacao">
                        <option value="">Todos os tipos</option>
                        <option value="clt">CLT</option>
                        <option value="pj">PJ</option>
                        <option value="estagio">Estágio</option>
                        <option value="freelancer">Freelancer</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-success w-100" onclick="aplicarFiltros()">
                        <i class="fas fa-filter"></i> Filtrar
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner-border text-success" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3">Carregando vagas...</p>
        </div>

        <!-- Lista de Vagas -->
        <div id="vagasContainer" style="display: none;">
            <!-- As vagas serão inseridas aqui via JavaScript -->
        </div>

        <!-- Nenhuma vaga encontrada -->
        <div id="noVagas" class="no-vagas" style="display: none;">
            <i class="fas fa-search fa-4x mb-3"></i>
            <h4>Nenhuma vaga encontrada</h4>
            <p>Tente ajustar os filtros ou volte mais tarde para ver novas oportunidades.</p>
        </div>
    </div>

    <!-- Modal de Candidatura -->
    <div class="modal fade" id="candidaturaModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Candidatar-se à Vaga</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="candidaturaForm">
                        <input type="hidden" id="candidaturaVagaId">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nomeCompleto" class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="nomeCompleto" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="emailCandidato" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="emailCandidato" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefoneCandidato" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="telefoneCandidato">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="experienciaESG" class="form-label">Anos de Experiência ESG</label>
                                <input type="number" class="form-control" id="experienciaESG" min="0" max="50" value="0">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="habilidadesESG" class="form-label">Habilidades ESG (separadas por vírgula)</label>
                            <input type="text" class="form-control" id="habilidadesESG" 
                                   placeholder="Ex: Relatórios de Sustentabilidade, Gestão Ambiental, ESG">
                        </div>
                        
                        <div class="mb-3">
                            <label for="curriculoTexto" class="form-label">Resumo do Currículo *</label>
                            <textarea class="form-control" id="curriculoTexto" rows="4" required
                                      placeholder="Descreva sua experiência, formação e principais conquistas..."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="motivacao" class="form-label">Por que você quer trabalhar nesta empresa?</label>
                            <textarea class="form-control" id="motivacao" rows="3"
                                      placeholder="Conte sua motivação para trabalhar com sustentabilidade..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="enviarCandidatura">
                        <i class="fas fa-paper-plane"></i> Enviar Candidatura
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let vagasData = [];
        let vagaAtual = null;

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Página de vagas carregada');
            carregarVagas();
            
            // Event listener para enviar candidatura
            document.getElementById('enviarCandidatura').addEventListener('click', enviarCandidatura);
        });

        async function carregarVagas() {
            try {
                console.log('📡 Carregando vagas...');
                const response = await fetch('/api/vagas');
                const data = await response.json();
                
                vagasData = data.vagas;
                document.getElementById('totalVagas').textContent = data.total;
                
                renderizarVagas(vagasData);
                
            } catch (error) {
                console.error('💥 Erro ao carregar vagas:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('noVagas').style.display = 'block';
            }
        }

        function renderizarVagas(vagas) {
            const container = document.getElementById('vagasContainer');
            const loading = document.getElementById('loading');
            const noVagas = document.getElementById('noVagas');
            
            loading.style.display = 'none';
            
            if (vagas.length === 0) {
                container.style.display = 'none';
                noVagas.style.display = 'block';
                return;
            }
            
            noVagas.style.display = 'none';
            container.style.display = 'block';
            
            container.innerHTML = vagas.map(vaga => `
                <div class="vaga-card">
                    <div class="vaga-header">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4 class="mb-2">${vaga.titulo}</h4>
                                <span class="empresa-badge">${vaga.empresa_nome || 'Empresa'}</span>
                            </div>
                            <span class="days-badge">
                                ${vaga.dias_publicada === 0 ? 'Hoje' : vaga.dias_publicada + ' dias atrás'}
                            </span>
                        </div>
                    </div>
                    
                    <div class="vaga-body">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="info-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>
                                        ${vaga.localizacao_cidade ? vaga.localizacao_cidade : 'Não informado'}
                                        ${vaga.localizacao_uf ? ', ' + vaga.localizacao_uf : ''}
                                        ${vaga.remoto ? ' • <i class="fas fa-home"></i> Remoto' : ''}
                                    </span>
                                </div>
                                
                                <div class="info-item">
                                    <i class="fas fa-user-tie"></i>
                                    <span>${(vaga.nivel_experiencia || 'Não informado').charAt(0).toUpperCase() + (vaga.nivel_experiencia || 'Não informado').slice(1)}</span>
                                </div>
                                
                                <div class="info-item">
                                    <i class="fas fa-briefcase"></i>
                                    <span>${(vaga.tipo_contratacao || 'Não informado').toUpperCase()}</span>
                                </div>
                                
                                ${vaga.salario_min ? `
                                <div class="info-item">
                                    <i class="fas fa-dollar-sign"></i>
                                    <span>R$ ${vaga.salario_min.toLocaleString('pt-BR')}${vaga.salario_max ? ' - R$ ' + vaga.salario_max.toLocaleString('pt-BR') : ''}</span>
                                </div>
                                ` : ''}
                                
                                ${vaga.descricao ? `
                                <div class="mt-3">
                                    <h6><i class="fas fa-align-left"></i> Descrição</h6>
                                    <p class="text-muted">${vaga.descricao.length > 150 ? vaga.descricao.substring(0, 150) + '...' : vaga.descricao}</p>
                                </div>
                                ` : ''}
                            </div>
                            
                            <div class="col-md-4 text-end">
                                <div class="mb-3">
                                    <small class="text-muted">
                                        <i class="fas fa-users"></i> ${vaga.total_candidaturas || 0} candidatura(s)
                                    </small>
                                </div>
                                
                                <button class="btn btn-candidatar" onclick="abrirCandidatura(${vaga.id}, '${vaga.titulo}')">
                                    <i class="fas fa-paper-plane"></i> Candidatar-se
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function abrirCandidatura(vagaId, titulo) {
            console.log('📝 Abrindo candidatura para vaga:', vagaId, titulo);
            vagaAtual = { id: vagaId, titulo: titulo };
            
            document.getElementById('candidaturaVagaId').value = vagaId;
            document.querySelector('#candidaturaModal .modal-title').innerHTML = 
                `<i class="fas fa-user-plus"></i> Candidatar-se: ${titulo}`;
            
            // Limpar formulário
            document.getElementById('candidaturaForm').reset();
            document.getElementById('candidaturaVagaId').value = vagaId;
            
            new bootstrap.Modal(document.getElementById('candidaturaModal')).show();
        }

        async function enviarCandidatura() {
            try {
                // Validar campos obrigatórios
                const nomeCompleto = document.getElementById('nomeCompleto').value.trim();
                const email = document.getElementById('emailCandidato').value.trim();
                const curriculo = document.getElementById('curriculoTexto').value.trim();
                
                if (!nomeCompleto || !email || !curriculo) {
                    alert('❌ Por favor, preencha todos os campos obrigatórios (*)');
                    return;
                }
                
                // Coletar dados do formulário
                const habilidadesTexto = document.getElementById('habilidadesESG').value.trim();
                const habilidades = habilidadesTexto ? habilidadesTexto.split(',').map(h => h.trim()) : [];
                
                const dadosCandidatura = {
                    vaga_id: parseInt(document.getElementById('candidaturaVagaId').value),
                    nome_completo: nomeCompleto,
                    email: email,
                    telefone: document.getElementById('telefoneCandidato').value.trim(),
                    curriculo_texto: curriculo,
                    anos_experiencia_esg: parseInt(document.getElementById('experienciaESG').value) || 0,
                    habilidades_esg: habilidades,
                    motivacao: document.getElementById('motivacao').value.trim()
                };
                
                console.log('📋 Enviando candidatura:', dadosCandidatura);
                
                // Mostrar loading
                const btn = document.getElementById('enviarCandidatura');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                btn.disabled = true;
                
                // Enviar para API
                const response = await fetch('/api/candidaturas/criar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dadosCandidatura)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert(`🎉 ${data.message}

Vaga: ${data.vaga_titulo}
Score de Compatibilidade: ${data.compatibilidade_score}%

Sua candidatura foi enviada com sucesso!`);
                    
                    // Fechar modal
                    bootstrap.Modal.getInstance(document.getElementById('candidaturaModal')).hide();
                    
                    // Recarregar vagas para atualizar contadores
                    carregarVagas();
                    
                } else {
                    alert('❌ Erro: ' + (data.detail || 'Erro desconhecido'));
                }
                
                // Restaurar botão
                btn.innerHTML = originalText;
                btn.disabled = false;
                
            } catch (error) {
                console.error('💥 Erro ao enviar candidatura:', error);
                alert('❌ Erro de conexão. Tente novamente.');
                
                // Restaurar botão
                const btn = document.getElementById('enviarCandidatura');
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Candidatura';
                btn.disabled = false;
            }
        }

        function aplicarFiltros() {
            const local = document.getElementById('filtroLocal').value;
            const nivel = document.getElementById('filtroNivel').value;
            const contratacao = document.getElementById('filtroContratacao').value;
            
            let vagasFiltradas = vagasData;
            
            if (local) {
                if (local === 'remoto') {
                    vagasFiltradas = vagasFiltradas.filter(v => v.remoto);
                } else {
                    vagasFiltradas = vagasFiltradas.filter(v => v.localizacao_uf === local);
                }
            }
            
            if (nivel) {
                vagasFiltradas = vagasFiltradas.filter(v => v.nivel_experiencia === nivel);
            }
            
            if (contratacao) {
                vagasFiltradas = vagasFiltradas.filter(v => v.tipo_contratacao === contratacao);
            }
            
            renderizarVagas(vagasFiltradas);
        }
    </script>
</body>
</html>
